<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NIKKE</title>
<style>
  :root {
    --bg: #f7f7f5; --surface: #fff; --text: #1d1d1b; --muted: #6b6b66;
    --border: #e3e3de; --accent: #2f6fdf; --row-hover: #f1f4fb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --surface: #1f1f1d; --text: #ececea; --muted: #9a9a94;
      --border: #33332f; --accent: #7aa7ff; --row-hover: #262a33;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  }
  main { max-width: 1200px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .meta { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  input[type=search] {
    flex: 1; min-width: 200px; padding: 10px 12px; font: inherit;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--text);
  }
  button {
    padding: 10px 14px; font: inherit; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
  }
  .table-wrap {
    overflow-x: auto; background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px;
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
  th {
    position: sticky; top: 0; background: var(--surface); font-weight: 600;
    white-space: nowrap; cursor: pointer; user-select: none;
  }
  th .arrow { color: var(--muted); font-size: 11px; margin-left: 4px; }
  tbody tr:hover { background: var(--row-hover); }
  tbody tr:last-child td { border-bottom: 0; }
  td a { color: var(--accent); }
  .status { padding: 24px; text-align: center; color: var(--muted); }
  .error { color: #d14343; }
</style>
</head>
<body>
<main>
  <h1 id="title">NIKKE</h1>
  <div class="meta" id="meta">불러오는 중…</div>
  <div class="toolbar">
    <input type="search" id="q" placeholder="검색">
    <button id="reload">새로고침</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead id="thead"></thead>
      <tbody id="tbody"><tr><td class="status">불러오는 중…</td></tr></tbody>
    </table>
  </div>
</main>

<script>
// ===== 설정 =====
const SHEET_ID = "1IvaV9_REBew6dSri571JopqcBbJ5QL2tToWglHhIMH4";
const GID = "2810458";             // 시트 탭 ID (URL의 #gid= 값)
const AUTO_REFRESH_SECONDS = 60;   // 0이면 자동 갱신 끔
// =================

let headers = [], rows = [], sortCol = -1, sortAsc = true;

// gviz JSONP: CORS 문제 없이 공개 시트를 읽을 수 있음
function loadSheet() {
  return new Promise((resolve, reject) => {
    const cb = "sheetCb_" + Date.now();
    const s = document.createElement("script");
    const timer = setTimeout(() => { cleanup(); reject(new Error("시간 초과")); }, 15000);
    function cleanup() { clearTimeout(timer); delete window[cb]; s.remove(); }
    window[cb] = (resp) => {
      cleanup();
      if (resp.status === "error") reject(new Error(resp.errors?.[0]?.detailed_message || "시트 오류"));
      else resolve(resp.table);
    };
    s.onerror = () => { cleanup(); reject(new Error("시트에 접근할 수 없습니다. 공유 설정을 확인하세요.")); };
    s.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${GID}&headers=1&tqx=responseHandler:${cb}&_=${Date.now()}`;
    document.body.appendChild(s);
  });
}

function cellText(c) {
  if (!c) return "";
  return c.f ?? (c.v == null ? "" : String(c.v));
}

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  let view = rows.filter(r => !q || r.some(v => v.toLowerCase().includes(q)));
  if (sortCol >= 0) {
    view = [...view].sort((a, b) => {
      const x = a[sortCol], y = b[sortCol];
      const nx = parseFloat(x.replace(/,/g, "")), ny = parseFloat(y.replace(/,/g, ""));
      const cmp = !isNaN(nx) && !isNaN(ny) ? nx - ny : x.localeCompare(y, "ko");
      return sortAsc ? cmp : -cmp;
    });
  }

  document.getElementById("thead").innerHTML =
    "<tr>" + headers.map((h, i) =>
      `<th data-i="${i}">${esc(h)}<span class="arrow">${i === sortCol ? (sortAsc ? "▲" : "▼") : ""}</span></th>`
    ).join("") + "</tr>";

  document.getElementById("tbody").innerHTML = view.length
    ? view.map(r => "<tr>" + r.map(v => `<td>${linkify(esc(v))}</td>`).join("") + "</tr>").join("")
    : `<tr><td class="status" colspan="${headers.length || 1}">결과가 없습니다</td></tr>`;
}

function esc(s) {
  return s.replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}
function linkify(s) {
  return s.replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
}

async function refresh() {
  const meta = document.getElementById("meta");
  try {
    const table = await loadSheet();
    headers = table.cols.map((c, i) => c.label || c.id || `열 ${i + 1}`);
    rows = table.rows
      .map(r => table.cols.map((_, i) => cellText(r.c[i])))
      .filter(r => r.some(v => v !== ""));
    // 빈 열 제거
    const keep = headers.map((h, i) => h.trim() !== "" || rows.some(r => r[i] !== ""));
    headers = headers.filter((_, i) => keep[i]);
    rows = rows.map(r => r.filter((_, i) => keep[i]));
    meta.textContent = `${rows.length}개 항목 · 마지막 갱신 ${new Date().toLocaleTimeString("ko-KR")}`;
    render();
  } catch (e) {
    meta.innerHTML = `<span class="error">불러오기 실패: ${esc(e.message)}</span>`;
  }
}

document.getElementById("q").addEventListener("input", render);
document.getElementById("reload").addEventListener("click", refresh);
document.getElementById("thead").addEventListener("click", e => {
  const th = e.target.closest("th"); if (!th) return;
  const i = +th.dataset.i;
  sortAsc = sortCol === i ? !sortAsc : true;
  sortCol = i;
  render();
});

refresh();
if (AUTO_REFRESH_SECONDS > 0) setInterval(refresh, AUTO_REFRESH_SECONDS * 1000);
</script>
</body>
</html>
