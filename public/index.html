<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NIKKE · 육성 가이드</title>
<meta name="description" content="승리의 여신: 니케 캐릭터별 스킬·오버로드·큐브·소장품 육성 가이드">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #06080c;
    --panel: #0c1118;
    --panel-2: #111823;
    --well: #0a0f15;
    --line: #1c2733;
    --line-hi: #2c3b4b;
    --text: #e6edf3;
    --muted: #7d8a99;
    --dim: #4a5664;
    --accent: #ff4655;
    --accent-soft: rgba(255, 70, 85, .14);
    --amber: #ffb547;
    --cyan: #3ad7f5;
    --cyan-soft: rgba(58, 215, 245, .12);
    --green: #55e39a;
    --pink: #ff6fd8;
    /* 스킬 빌드업 단계 색 (시트: 검정 → 하늘 → 주황 → 자홍) */
    --st1: #c9d1d9;
    --st2: #3ad7f5;
    --st3: #ff9b3d;
    --st4: #ff4fd8;
    --display: "Rajdhani", "Noto Sans KR", sans-serif;
    --body: "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif;
    /* 맨 위 Nebula 사이트 전환 바 색 (nebula.kim/switcher.js 가 읽음) */
    --nebula-bar-bg: #06080c;
    --nebula-bar-fg: #e6edf3;
    --nebula-bar-muted: #7d8a99;
    --nebula-bar-border: #1c2733;
    --nebula-bar-active: #1c2733;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; color: var(--text); font: 14px/1.55 var(--body);
    background:
      linear-gradient(rgba(58, 215, 245, .035) 1px, transparent 1px) 0 0 / 100% 32px,
      linear-gradient(90deg, rgba(58, 215, 245, .035) 1px, transparent 1px) 0 0 / 32px 100%,
      radial-gradient(1200px 600px at 85% -10%, rgba(255, 70, 85, .12), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    min-height: 100vh;
  }

  /* ---------- header ---------- */
  header {
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(12, 17, 24, .95), rgba(6, 8, 12, .85));
    backdrop-filter: blur(6px);
    position: sticky; top: 0; z-index: 10;
  }
  .bar {
    max-width: 1320px; margin: 0 auto; padding: 14px 16px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .logo { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
  .logo b {
    font: 700 26px/1 var(--display); letter-spacing: .18em; color: var(--text);
    text-shadow: 0 0 18px rgba(255, 70, 85, .45);
  }
  .logo b::first-letter { color: var(--accent); }
  .logo span {
    font: 600 12px/1 var(--display); letter-spacing: .25em; color: var(--muted);
    text-transform: uppercase;
  }
  .status-line {
    font: 500 12px/1 var(--display); letter-spacing: .12em; color: var(--muted);
    display: flex; align-items: center; gap: 8px; text-transform: uppercase;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
  .dot.ok { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .dot.err { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .dot.load { background: var(--amber); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .25; } }

  main { max-width: 1320px; margin: 0 auto; padding: 24px 16px 64px; }

  /* ---------- briefing ---------- */
  .brief {
    border: 1px solid var(--line); background: var(--panel);
    clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px));
    margin-bottom: 20px;
  }
  .brief summary {
    list-style: none; cursor: pointer; padding: 12px 18px;
    display: flex; align-items: center; gap: 10px;
    font: 600 13px/1 var(--display); letter-spacing: .2em; color: var(--amber);
    text-transform: uppercase;
  }
  .brief summary::-webkit-details-marker { display: none; }
  .brief summary::after { content: "+"; margin-left: auto; color: var(--muted); font-size: 18px; }
  .brief[open] summary::after { content: "−"; }
  .brief-body { padding: 0 18px 16px; color: #c3ccd6; font-size: 13px; }
  .brief-body p { margin: 0 0 6px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; }

  /* ---------- controls ---------- */
  .controls { display: grid; grid-template-columns: 1fr auto; gap: 12px; margin-bottom: 14px; }
  .search { position: relative; }
  .search input {
    width: 100%; padding: 12px 14px 12px 40px; font: inherit; color: var(--text);
    background: var(--panel); border: 1px solid var(--line); border-radius: 0;
    outline: none; transition: border-color .15s;
  }
  .search input:focus { border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan-soft); }
  .search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .btn {
    font: 600 13px/1 var(--display); letter-spacing: .15em; text-transform: uppercase;
    padding: 0 18px; color: var(--text); background: var(--panel-2);
    border: 1px solid var(--line-hi); cursor: pointer; transition: all .15s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }

  .filters { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  .frow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .frow .label {
    font: 600 11px/1 var(--display); letter-spacing: .2em; color: var(--muted);
    text-transform: uppercase; width: 56px; flex-shrink: 0;
  }
  .chip {
    font: 500 12px/1 var(--body); padding: 7px 11px; cursor: pointer;
    color: var(--muted); background: transparent; border: 1px solid var(--line-hi);
    transition: all .15s;
  }
  .chip:hover { color: var(--text); }
  .chip.on { color: var(--bg); background: var(--cyan); border-color: var(--cyan); font-weight: 700; }
  .count { margin-left: auto; font: 600 13px/1 var(--display); letter-spacing: .12em; color: var(--muted); }
  .count b { color: var(--text); font-size: 16px; }

  /* ---------- grid ---------- */
  .grid {
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr));
  }
  .card {
    position: relative; background: linear-gradient(160deg, var(--panel-2), var(--panel) 40%);
    border: 1px solid var(--line);
    clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%);
    padding: 14px 16px; display: flex; flex-direction: column; gap: 12px;
    transition: border-color .15s, transform .15s;
  }
  .card:hover { border-color: var(--line-hi); transform: translateY(-2px); }
  .card::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--co, var(--dim));
  }
  .card[data-co="엘리시온"] { --co: #4f8dff; }
  .card[data-co="미실리스"] { --co: #ffb547; }
  .card[data-co="테트라"] { --co: #ff6fd8; }
  .card[data-co="필그림"] { --co: #55e39a; }
  .card[data-co="어브노멀"] { --co: #ff4655; }

  .head { display: flex; gap: 12px; align-items: center; }
  .portrait {
    width: 64px; height: 64px; flex-shrink: 0; background: var(--well);
    border: 1px solid var(--line-hi); position: relative; overflow: hidden;
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
  }
  .portrait img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .portrait::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 60%, rgba(6, 8, 12, .5));
  }
  .names { flex: 1; min-width: 0; }
  .name { font-size: 18px; font-weight: 700; line-height: 1.25; }
  .sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .pill {
    font-size: 11px; line-height: 1; padding: 4px 7px; color: var(--muted);
    border: 1px solid var(--line-hi); background: var(--well);
  }
  .pill.co { color: var(--co); border-color: color-mix(in srgb, var(--co) 45%, transparent); }
  .pill.mode { font: 700 11px/1 var(--display); letter-spacing: .1em; }
  .pill.pve { color: var(--green); border-color: rgba(85, 227, 154, .4); }
  .pill.pvp { color: var(--accent); border-color: rgba(255, 70, 85, .4); }
  .pill.fav { color: var(--pink); border-color: rgba(255, 111, 216, .45); }

  .sec-title {
    font: 600 11px/1 var(--display); letter-spacing: .22em; color: var(--muted);
    text-transform: uppercase; margin-bottom: 7px; display: flex; align-items: center; gap: 8px;
  }
  .sec-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .sec-title small { letter-spacing: .05em; text-transform: none; font: 400 11px/1 var(--body); color: var(--dim); }

  .skills { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
  .lv {
    position: relative; padding: 8px 4px 6px; text-align: center; background: var(--well);
    border: 1px solid var(--line); font: 700 14px/1 var(--display); letter-spacing: .04em;
    white-space: nowrap; color: var(--st);
  }
  .lv::before { content: ""; position: absolute; left: -1px; right: -1px; top: -1px; height: 2px; background: var(--st); }
  .lv:nth-child(1) { --st: var(--st1); }
  .lv:nth-child(2) { --st: var(--st2); }
  .lv:nth-child(3) { --st: var(--st3); }
  .lv:nth-child(4) { --st: var(--st4); }
  .lv span { color: var(--dim); font-weight: 500; margin: 0 1px; }

  .ol { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
  .ol > div {
    font-size: 12px; padding: 6px 8px 6px 24px; background: var(--well); border: 1px solid var(--line);
    position: relative; min-width: 0;
  }
  .ol > div::before {
    content: attr(data-n); position: absolute; left: 7px; top: 7px;
    font: 700 11px/1 var(--display); color: var(--amber);
  }
  .ol > div:first-child { border-color: rgba(255, 181, 71, .45); }
  .ol .hint { display: block; font-size: 11px; color: var(--muted); }

  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag { font-size: 12px; padding: 4px 8px; background: var(--well); border: 1px solid var(--line-hi); }
  .tag.cube:first-child { border-color: var(--cyan); color: var(--cyan); }
  .tag.opt { color: #c3ccd6; }
  .tag.use { color: var(--cyan); background: var(--cyan-soft); border-color: transparent; }

  .gear { display: grid; grid-template-columns: 1fr auto; gap: 12px; }
  .coll { display: flex; flex-direction: column; gap: 4px; align-items: stretch; }
  .coll span {
    font: 700 14px/1 var(--display); letter-spacing: .06em; padding: 6px 10px;
    border: 1px solid var(--line-hi); text-align: center; white-space: nowrap;
  }
  .coll span.alt { font-size: 12px; color: var(--muted); border-style: dashed; }

  .notes { margin: 0; padding: 0; list-style: none; font-size: 12.5px; color: var(--amber); }
  .notes li { padding-left: 2px; }
  .none { color: var(--dim); font-size: 12px; }

  .empty, .loading {
    grid-column: 1 / -1; text-align: center; padding: 60px 0; color: var(--muted);
    font: 600 14px/1.6 var(--display); letter-spacing: .2em; text-transform: uppercase;
  }
  .loading::after { content: ""; display: block; width: 120px; height: 2px; margin: 18px auto 0;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    background-size: 200% 100%; animation: scan 1.2s linear infinite; }
  @keyframes scan { from { background-position: 200% 0; } to { background-position: -200% 0; } }

  footer { text-align: center; color: var(--dim); font-size: 12px; padding: 0 16px 32px; }

  @media (max-width: 560px) {
    .logo b { font-size: 22px; }
    .status-line { width: 100%; }
    .frow .label { width: 100%; }
    .count { width: 100%; margin: 4px 0 0; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo"><b>NIKKE</b><span>Build Guide</span></div>
    <div class="status-line"><i class="dot load" id="dot"></i><span id="status">Syncing…</span></div>
  </div>
</header>

<main>
  <details class="brief" id="brief" hidden>
    <summary>Briefing · 육성 가이드 안내</summary>
    <div class="brief-body">
      <div id="briefBody"></div>
      <div class="legend">
        <span><i style="background:var(--st1)"></i>1단계</span>
        <span><i style="background:var(--st2)"></i>2단계</span>
        <span><i style="background:var(--st3)"></i>3단계</span>
        <span><i style="background:var(--st4)"></i>4단계</span>
        <span>· 스킬 표기: 1스킬 / 2스킬 / 버스트</span>
      </div>
    </div>
  </details>

  <div class="controls">
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="q" placeholder="니케 이름, 큐브, 옵션, 메모 검색" autocomplete="off">
    </label>
    <button class="btn" id="reload">Sync</button>
  </div>

  <div class="filters">
    <div class="frow" data-key="company"><span class="label">기업</span></div>
    <div class="frow" data-key="weapon"><span class="label">무기</span></div>
    <div class="frow" data-key="mode"><span class="label">사용처</span></div>
    <div class="frow">
      <span class="label">기타</span>
      <button class="chip" id="favToggle">애장품</button>
      <span class="count" id="count"></span>
    </div>
  </div>

  <div class="grid" id="grid"><div class="loading">Loading data</div></div>
</main>

<footer>데이터 출처: [승리의 여신 : 니케] 육성 시트 · 시트가 수정되면 몇 분 안에 자동 반영됩니다</footer>

<script>
const state = { list: [], q: "", fav: false, company: "", weapon: "", mode: "" };
const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));

async function load(fresh) {
  const res = await fetch("/api/data" + (fresh ? "?fresh=1" : ""));
  const data = await res.json();
  if (!res.ok || data.error) throw new Error(data.error || "데이터를 불러오지 못했습니다");
  return data;
}

function card(n) {
  const skills = n.skills.some(s => s.some(Boolean))
    ? `<div class="skills">${n.skills.map(s => `<div class="lv">${s.map(v => esc(v || "-")).join("<span>/</span>")}</div>`).join("")}</div>`
    : `<span class="none">정보 없음</span>`;
  const ol = n.overload.length
    ? `<div class="ol">${n.overload.map((o, i) =>
        `<div data-n="${i + 1}">${esc(o[0])}${o.slice(1).map(h => `<span class="hint">${esc(h)}</span>`).join("")}</div>`).join("")}</div>`
    : `<span class="none">-</span>`;
  const coll = n.coll.length
    ? n.coll.map(c => `<span class="${/^\(.*\)$/.test(c) ? "alt" : ""}">${esc(c)}</span>`).join("")
    : `<span>-</span>`;
  return `
  <article class="card" data-co="${esc(n.company)}">
    <div class="head">
      <div class="portrait">${n.image ? `<img src="${esc(n.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ""}</div>
      <div class="names">
        <div class="name">${esc(n.name)}</div>
        ${n.sub ? `<div class="sub">${esc(n.sub)}</div>` : ""}
        <div class="meta">
          <span class="pill co">${esc(n.company)}</span>
          <span class="pill">${esc(n.weapon)}</span>
          ${n.modes.map(m => `<span class="pill mode ${m.toLowerCase()}">${m}</span>`).join("")}
          ${n.favorite ? `<span class="pill fav">애장품${n.favPriority ? " · " + esc(n.favPriority) : ""}</span>` : ""}
        </div>
      </div>
    </div>
    ${n.usage.length ? `<div class="chips">${n.usage.map(u => `<span class="tag use">${esc(u)}</span>`).join("")}</div>` : ""}
    <div>
      <div class="sec-title">Skill <small>1스킬 / 2스킬 / 버스트 · 빌드업 순서</small></div>
      ${skills}
    </div>
    <div>
      <div class="sec-title">Overload <small>우선순위 · ( )는 최소~권장 줄 수</small></div>
      ${ol}
    </div>
    ${n.extra.length ? `<div>
      <div class="sec-title">유효 추가 옵션</div>
      <div class="chips">${n.extra.map(x => `<span class="tag opt">${esc(x)}</span>`).join("")}</div>
    </div>` : ""}
    <div class="gear">
      <div>
        <div class="sec-title">Cube</div>
        <div class="chips">${n.cube.map(c => `<span class="tag cube">${esc(c)}</span>`).join("") || `<span class="none">-</span>`}</div>
      </div>
      <div>
        <div class="sec-title">${n.favorite ? "애장품" : "소장품"}</div>
        <div class="coll">${coll}</div>
      </div>
    </div>
    ${n.footnotes.length ? `<ul class="notes">${n.footnotes.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : ""}
  </article>`;
}

function render() {
  const q = state.q.trim().toLowerCase();
  const view = state.list.filter(n =>
    (!state.company || n.company === state.company) &&
    (!state.weapon || n.weapon === state.weapon) &&
    (!state.mode || n.modes.includes(state.mode)) &&
    (!state.fav || n.favorite) &&
    (!q || n.text.includes(q))
  );
  document.getElementById("grid").innerHTML = view.length
    ? view.map(card).join("")
    : `<div class="empty">No match · 검색 결과가 없습니다</div>`;
  document.getElementById("count").innerHTML = `<b>${view.length}</b> / ${state.list.length} NIKKE`;
}

function buildFilters() {
  const opts = {
    company: [...new Set(state.list.map(n => n.company))],
    weapon: [...new Set(state.list.map(n => n.weapon))],
    mode: ["PVE", "PVP"],
  };
  document.querySelectorAll(".frow[data-key]").forEach(row => {
    const key = row.dataset.key;
    row.querySelectorAll("button").forEach(b => b.remove());
    ["", ...opts[key]].forEach(v => {
      const b = document.createElement("button");
      b.className = "chip" + (state[key] === v ? " on" : "");
      b.textContent = v || "전체";
      b.onclick = () => {
        state[key] = v;
        row.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
        render();
      };
      row.appendChild(b);
    });
  });
}

function renderBrief(intro) {
  const body = intro.slice(1).join("\n").split("\n").map(l => l.trim()).filter(Boolean);
  if (!body.length) return;
  document.getElementById("briefBody").innerHTML = body.map(l => `<p>${esc(l)}</p>`).join("");
  document.getElementById("brief").hidden = false;
}

function setStatus(kind, msg) {
  document.getElementById("dot").className = "dot " + kind;
  document.getElementById("status").textContent = msg;
}

async function refresh(fresh) {
  setStatus("load", "Syncing…");
  try {
    const data = await load(fresh);
    state.list = data.list.map(n => ({
      ...n,
      text: [n.name, n.sub, n.company, n.weapon, ...n.cube, ...n.extra, ...n.usage, ...n.overload.flat(), ...n.footnotes]
        .join(" ").toLowerCase(),
    }));
    renderBrief(data.intro);
    buildFilters();
    render();
    const t = new Date(data.updated).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
    setStatus("ok", "Synced " + t);
  } catch (e) {
    setStatus("err", "Sync failed");
    if (!state.list.length) document.getElementById("grid").innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; render(); });
document.getElementById("reload").addEventListener("click", () => refresh(true));
document.getElementById("favToggle").addEventListener("click", e => {
  state.fav = !state.fav;
  e.currentTarget.classList.toggle("on", state.fav);
  render();
});

refresh(false);
</script>
<!-- 맨 위 Nebula 사이트 전환 바 (사이트 목록은 nebula.kim/sites.json 한 곳에서 관리) -->
<script src="https://nebula.kim/switcher.js" data-site="nikke" defer></script>
</body>
</html>
